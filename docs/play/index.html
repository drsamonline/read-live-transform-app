"part":"part-7","verse_ref":"QUR'AN • 3:200 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Endure, outdo all others in endurance, be ready, and observe your duty to Allah, in order that ye may succeed.","html":"<p class=\"lead\"><span class=\"dropcap\">R<\/span>esilience is not pretending that nothing hurts. It is continuing to act with steadiness while difficulty is present.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 3:200 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Endure, outdo all others in endurance, be ready, and observe your duty to Allah, in order that ye may succeed.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse places endurance beside readiness and duty. Patience is therefore not passive resignation. It includes staying prepared and remaining responsible.<\/p><p>A resilient person may be tired, disappointed, or afraid and still keep a basic structure: prayer, work, family duty, honesty, rest, and repair. The point is not to become emotionless.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Choose three duties that should continue during difficult periods. Keep them small enough to be realistic.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Choose three duties that should continue during difficult periods. Keep them small enough to be realistic.","questions":["What must not collapse when life becomes difficult?","Which routine helps me remain responsible?","Where do I need help?"]},{"n":42,"title":"Forgiving Others","part":"part-8","verse_ref":"QUR'AN • 42:40 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"The guerdon of an ill-deed is an ill the like thereof. But whosoever pardoneth and amendeth, his wage is the affair of Allah. Lo! He loveth not wrong-doers.","html":"<p class=\"lead\"><span class=\"dropcap\">F<\/span>orgiveness is presented as a real moral choice, not as denial of the wrong that happened.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 42:40 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">The guerdon of an ill-deed is an ill the like thereof. But whosoever pardoneth and amendeth, his wage is the affair of Allah. Lo! He loveth not wrong-doers.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse first recognises response to wrongdoing and then mentions pardon together with amendment. Forgiveness therefore does not require pretending that the wrong was acceptable.<\/p><p>Sometimes forgiveness means releasing the desire to keep punishing someone in your mind. It does not necessarily mean restoring trust immediately or removing sensible boundaries.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Separate forgiveness from trust. You may forgive while still requiring accountability and distance.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Separate forgiveness from trust. You may forgive while still requiring accountability and distance.","questions":["What exactly am I being asked to release?","What boundary still needs to remain?","Would forgiveness help me stop carrying the injury?"]},{"n":43,"title":"Seeking Forgiveness","part":"part-8","verse_ref":"QUR'AN • 3:135 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And those who, when they do an evil thing or wrong themselves, remember Allah and implore forgiveness for their sins - Who forgiveth sins save Allah only? - and will not knowingly repeat (the wrong) they did.","html":"<p class=\"lead\"><span class=\"dropcap\">R<\/span>ecognising wrongdoing is only the beginning. The Qur'an connects remembrance, seeking forgiveness, and not knowingly repeating the wrong.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 3:135 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And those who, when they do an evil thing or wrong themselves, remember Allah and implore forgiveness for their sins - Who forgiveth sins save Allah only? - and will not knowingly repeat (the wrong) they did.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse does not describe forgiveness as a permission to continue deliberately. It includes recognition and a refusal to knowingly persist.<\/p><p>If you spoke cruelly, cheated, neglected a duty, or harmed someone, saying “sorry” is not the whole repair. The practical question is what changes so that the same wrong is not repeated knowingly.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Name the wrong. Seek forgiveness. Repair what can be repaired. Change the condition that keeps producing the same behaviour.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Name the wrong. Seek forgiveness. Repair what can be repaired. Change the condition that keeps producing the same behaviour.","questions":["What did I actually do?","Who was affected?","What must change so I do not knowingly repeat it?"]},{"n":44,"title":"Repentance","part":"part-8","verse_ref":"QUR'AN • 66:8 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Turn unto Allah in sincere repentance! It may be that your Lord will remit from you your evil deeds and bring you into Gardens underneath which rivers flow, on the day when Allah will not abase the Prophet and those who believe with him.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>urning back is meaningful when regret becomes a change in direction.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 66:8 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Turn unto Allah in sincere repentance! It may be that your Lord will remit from you your evil deeds and bring you into Gardens underneath which rivers flow, on the day when Allah will not abase the Prophet and those who believe with him.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse directly calls believers to sincere repentance. It is not merely a command to feel guilty. Repentance is a return to Allah after wrongdoing.<\/p><p>A person can spend years repeating one harmful pattern and calling the regret itself repentance. The Qur'anic language pushes the reader toward a real turn.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Identify one repeated wrong. Remove one route that makes it easy to repeat. Replace it with a concrete better action.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Identify one repeated wrong. Remove one route that makes it easy to repeat. Replace it with a concrete better action.","questions":["What am I repeatedly doing wrong?","What keeps making the wrong easy?","What change would show that I have turned?"]},{"n":45,"title":"Mercy","part":"part-8","verse_ref":"QUR'AN • 7:156 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And ordain for us in this world that which is good, and in the Hereafter (that which is good), Lo! We have turned unto Thee. He said: I smite with My punishment whom I will, and My mercy embraceth all things, therefore I shall ordain it for those who ward off (evil) and pay the poor-due, and those who believe Our revelations;","html":"<p class=\"lead\"><span class=\"dropcap\">M<\/span>ercy in the Qur'an is not sentimental weakness. It is connected with Allah and with how human beings should conduct themselves.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 7:156 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And ordain for us in this world that which is good, and in the Hereafter (that which is good), Lo! We have turned unto Thee. He said: I smite with My punishment whom I will, and My mercy embraceth all things, therefore I shall ordain it for those who ward off (evil) and pay the poor-due, and those who believe Our revelations;<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse contains a wider passage about punishment and mercy. The phrase about mercy should not be isolated into a claim that consequences do not matter. It points to the breadth of Allah's mercy while retaining moral responsibility.<\/p><p>In ordinary life, mercy may mean giving someone room to correct a mistake rather than humiliating them for it. It can coexist with a clear boundary.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Before responding to another person's mistake, ask whether correction can be given without needless humiliation.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Before responding to another person's mistake, ask whether correction can be given without needless humiliation.","questions":["Where am I being unnecessarily harsh?","What correction is actually needed?","Can I be firm without being cruel?"]},{"n":46,"title":"Justice and Forgiveness","part":"part-8","verse_ref":"QUR'AN • 5:8 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Be steadfast witnesses for Allah in equity, and let not hatred of any people seduce you that ye deal not justly. Deal justly, that is nearer to your duty. Observe your duty to Allah. Lo! Allah is Informed of what ye do.","html":"<p class=\"lead\"><span class=\"dropcap\">J<\/span>ustice and forgiveness are not identical. The Qur'an allows pardon while also recognising wrongdoing.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 5:8 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Be steadfast witnesses for Allah in equity, and let not hatred of any people seduce you that ye deal not justly. Deal justly, that is nearer to your duty. Observe your duty to Allah. Lo! Allah is Informed of what ye do.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse addresses justice even toward people one dislikes. It prevents emotion from becoming a license for unfair treatment.<\/p><p>In a family dispute, workplace disagreement, or public argument, dislike can change the facts in our mind. Justice requires resisting that distortion.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Before judging someone you dislike, write the facts separately from your feelings about the person.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Before judging someone you dislike, write the facts separately from your feelings about the person.","questions":["What fact would I accept if the person were someone I liked?","Where is dislike affecting my judgment?","What would fair treatment look like?"]},{"n":47,"title":"Reconciliation","part":"part-8","verse_ref":"QUR'AN • 49:10 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"The believers are naught else than brothers. Therefore make peace between your brethren and observe your duty to Allah that haply ye may obtain mercy.","html":"<p class=\"lead\"><span class=\"dropcap\">R<\/span>econciliation requires more than wanting peace. It requires action toward making peace.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 49:10 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">The believers are naught else than brothers. Therefore make peace between your brethren and observe your duty to Allah that haply ye may obtain mercy.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse directly instructs believers to make peace between their brothers. The application should not be confused with the exact scope of the original community instruction, but the principle of actively repairing conflict is clear.<\/p><p>A disagreement often survives because each person waits for the other to move first. Reconciliation begins when someone takes a responsible step without needing to win the argument.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>State the issue without insult. Ask what repair would look like. If direct contact is unsafe or unwise, use an appropriate mediator.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"State the issue without insult. Ask what repair would look like. If direct contact is unsafe or unwise, use an appropriate mediator.","questions":["Is the goal to repair or to win?","What part can I own?","What safe step toward peace is available?"]},{"n":48,"title":"What Do You Want?","part":"part-9","verse_ref":"QUR'AN • 3:14 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Beautified for mankind is love of the joys (that come) from women and offspring and stored-up heaps of gold and silver, and horses branded (with their mark) and cattle and land. That is comfort of the life of the world. Allah! With Him is a more excellent abode.","html":"<p class=\"lead\"><span class=\"dropcap\">D<\/span>esire can quietly become the organiser of a life. The Qur'an asks the reader to notice what is being wanted and why.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 3:14 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Beautified for mankind is love of the joys (that come) from women and offspring and stored-up heaps of gold and silver, and horses branded (with their mark) and cattle and land. That is comfort of the life of the world. Allah! With Him is a more excellent abode.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse names familiar attractions of worldly life. It does not say that every material good is forbidden. It asks the reader to see the difference between temporary attraction and the better abode with Allah.<\/p><p>A person may think they need one more purchase, one more promotion, one more compliment, or one more achievement before they can feel settled. Desire can keep moving the finish line.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>List three things you strongly want. Beside each, write what you expect the thing to give you emotionally.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"List three things you strongly want. Beside each, write what you expect the thing to give you emotionally.","questions":["What do I want?","What do I think it will give me?","Is the price of pursuing it reasonable?"]},{"n":49,"title":"Asking","part":"part-9","verse_ref":"QUR'AN • 2:186 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And when My servants question thee concerning Me, then surely I am nigh. I answer the prayer of the suppliant when he crieth unto Me. So let them hear My call and let them trust in Me, in order that they may be led aright.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an presents calling upon Allah as a real act of relationship, not as a technique for controlling outcomes.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 2:186 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And when My servants question thee concerning Me, then surely I am nigh. I answer the prayer of the suppliant when he crieth unto Me. So let them hear My call and let them trust in Me, in order that they may be led aright.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse links asking with listening and trust. It does not promise that every requested outcome will appear in the form or time the person imagines.<\/p><p>A person may ask for a job, healing, reconciliation, guidance, or relief. The practical discipline is to ask sincerely while remaining willing to follow guidance and accept an outcome that is not fully under personal control.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Make the request specific. Then ask what responsibility accompanies the request.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Make the request specific. Then ask what responsibility accompanies the request.","questions":["What am I asking for?","What guidance am I also being asked to follow?","What action belongs to me?"]},{"n":50,"title":"Effort","part":"part-9","verse_ref":"QUR'AN • 53:39 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And that man hath only that for which he maketh effort,","html":"<p class=\"lead\"><span class=\"dropcap\">H<\/span>uman effort matters, but the Qur'an does not promise that effort gives us every desired result.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 53:39 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And that man hath only that for which he maketh effort,<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse establishes the importance of human striving. It should not be stretched into a guarantee of worldly success. Effort is part of responsibility; outcomes remain larger than our control.<\/p><p>Two people can work equally hard and receive different results. That difference does not make effort meaningless. It makes effort something to be judged by direction, honesty, and responsibility rather than by outcome alone.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Choose one goal. Define the effort that genuinely belongs to you instead of measuring only the result.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Choose one goal. Define the effort that genuinely belongs to you instead of measuring only the result.","questions":["What part of this goal is actually mine?","Am I confusing effort with outcome?","Is the effort itself honest and worthwhile?"]},{"n":51,"title":"Tawakkul","part":"part-9","verse_ref":"QUR'AN • 3:159 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"It was by the mercy of Allah that thou wast lenient with them (O Muhammad), for if thou hadst been stern and fierce of heart they would have dispersed from round about thee. So pardon them and ask forgiveness for them and consult with them upon the conduct of affairs. And when thou art resolved, then put thy trust in Allah. Lo! Allah loveth those who put their trust (in Him).","html":"<p class=\"lead\"><span class=\"dropcap\">R<\/span>eliance on Allah belongs after responsible decision and action, not as an excuse to avoid both.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 3:159 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">It was by the mercy of Allah that thou wast lenient with them (O Muhammad), for if thou hadst been stern and fierce of heart they would have dispersed from round about thee. So pardon them and ask forgiveness for them and consult with them upon the conduct of affairs. And when thou art resolved, then put thy trust in Allah. Lo! Allah loveth those who put their trust (in Him).<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse is addressed to the Prophet in a specific leadership setting and includes leniency, pardon, consultation, decision, and then reliance on Allah. It should not be reduced to a generic productivity formula.<\/p><p>In a difficult decision, a person can gather the facts, consult appropriate people, decide, act, and then stop pretending that every later event is personally controllable.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Consult where consultation is appropriate. Decide when the decision is due. Then act without endless second-guessing.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Consult where consultation is appropriate. Decide when the decision is due. Then act without endless second-guessing.","questions":["What information do I still need?","Whom should I consult?","At what point must I decide and trust Allah?"]},{"n":52,"title":"When Things Do Not Go Your Way","part":"part-9","verse_ref":"QUR'AN • 2:216 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Warfare is ordained for you, though it is hateful unto you; but it may happen that ye hate a thing which is good for you, and it may happen that ye love a thing which is bad for you. Allah knoweth, ye know not.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an recognises that human beings can dislike something that contains good, or love something that contains harm.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 2:216 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Warfare is ordained for you, though it is hateful unto you; but it may happen that ye hate a thing which is good for you, and it may happen that ye love a thing which is bad for you. Allah knoweth, ye know not.<\/div><\/div><h2>What the verse gives us<\/h2><p>The immediate subject of 2:216 is warfare, not everyday decision-making. The broader statement about limited human knowledge can be applied carefully beyond that context, but it should not erase the original subject.<\/p><p>A rejected application, ended relationship, or changed plan can feel like pure loss. We often do not know enough to judge the whole future from one present event.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Allow disappointment without claiming certainty about what the future will contain.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Allow disappointment without claiming certainty about what the future will contain.","questions":["What do I know?","What am I merely assuming?","Can I continue responsibly without knowing the final result?"]},{"n":53,"title":"Acceptance","part":"part-9","verse_ref":"QUR'AN • 65:3 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And will provide for him from (a quarter) whence he hath no expectation. And whosoever putteth his trust in Allah, He will suffice him.","html":"<p class=\"lead\"><span class=\"dropcap\">A<\/span>cceptance does not mean approving every circumstance. It means recognising reality before deciding what to do next.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 65:3 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And will provide for him from (a quarter) whence he hath no expectation. And whosoever putteth his trust in Allah, He will suffice him.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse occurs in a passage dealing with divorce and duty, so its immediate setting matters. Its statement about reliance on Allah can support a broader practical lesson about not treating the present situation as the whole of what is possible.<\/p><p>When reality changes, arguing internally with the fact can consume the energy needed for the next responsible step. Acceptance begins with saying, “This is what has happened.”<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Write the situation in one factual sentence. Then write the next action that remains possible.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Write the situation in one factual sentence. Then write the next action that remains possible.","questions":["What fact am I resisting?","What action remains open?","What am I placing in Allah's care?"]},{"n":54,"title":"Parents","part":"part-10","verse_ref":"QUR'AN • 17:23 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Thy Lord hath decreed, that ye worship none save Him, and (that ye show) kindness to parents. If one of them or both of them attain old age with thee, say not \"Fie\" unto them nor repulse them, but speak unto them a gracious word.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an connects worship of Allah with kindness toward parents and specifically addresses how to speak when they become old.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 17:23 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Thy Lord hath decreed, that ye worship none save Him, and (that ye show) kindness to parents. If one of them or both of them attain old age with thee, say not \"Fie\" unto them nor repulse them, but speak unto them a gracious word.<\/div><\/div><h2>What the verse gives us<\/h2><p>The instruction is concrete: do not express contempt or repel them, and speak graciously. It does not require the reader to pretend that every family relationship is simple.<\/p><p>Adult children may disagree with parents about money, marriage, work, religion, or daily decisions. Respectful speech does not require surrendering every boundary.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Remove one contemptuous phrase from your speech. If a difficult boundary is necessary, state it without insult.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Remove one contemptuous phrase from your speech. If a difficult boundary is necessary, state it without insult.","questions":["Where does irritation become disrespect?","What can I say more graciously?","Which boundary can be kept without contempt?"]},{"n":55,"title":"Family","part":"part-10","verse_ref":"QUR'AN • 30:21 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And of His signs is this: He created for you helpmeets from yourselves that ye might find rest in them, and He ordained between you love and mercy. Lo! herein indeed are portents for folk who reflect.","html":"<p class=\"lead\"><span class=\"dropcap\">C<\/span>lose relationships test whether principles remain real when emotions are strong.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 30:21 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And of His signs is this: He created for you helpmeets from yourselves that ye might find rest in them, and He ordained between you love and mercy. Lo! herein indeed are portents for folk who reflect.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse speaks about spouses, rest, affection and mercy. It does not promise that marriage is free of disagreement. It identifies love and mercy as part of the relationship's intended good.<\/p><p>In family life, affection is often shown through small repeated actions: listening, keeping promises, helping with work, speaking without contempt, and repairing after conflict.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Choose one practical act of care that reduces unnecessary strain on someone close to you.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Choose one practical act of care that reduces unnecessary strain on someone close to you.","questions":["Does my behaviour create rest or tension?","Where is mercy missing?","What small act of care can I repeat?"]},{"n":56,"title":"Trust","part":"part-10","verse_ref":"QUR'AN • 4:58 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Lo! Allah commandeth you that ye restore deposits to their owners, and, if ye judge between mankind, that ye judge justly. Lo! comely is this which Allah admonisheth you. Lo! Allah is ever Hearer, Seer.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>rust is not merely a feeling. It carries responsibility for what has been placed in your care.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 4:58 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Lo! Allah commandeth you that ye restore deposits to their owners, and, if ye judge between mankind, that ye judge justly. Lo! comely is this which Allah admonisheth you. Lo! Allah is ever Hearer, Seer.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse joins returning trusts with judging justly. A trust may be money, information, responsibility, authority, or an entrusted task, depending on the situation.<\/p><p>If someone gives you confidential information, money to hold, or responsibility for a project, the trust is not yours to use casually.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>List one trust currently in your hands. Check whether you are preserving it as you would want another person to preserve yours.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"List one trust currently in your hands. Check whether you are preserving it as you would want another person to preserve yours.","questions":["What has been entrusted to me?","Have I used it only as authorised?","What needs to be returned or corrected?"]},{"n":57,"title":"Speech","part":"part-10","verse_ref":"QUR'AN • 33:70 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Guard your duty to Allah, and speak words straight to the point;","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an treats speech as morally significant. The instruction is not merely to avoid obvious lies.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 33:70 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Guard your duty to Allah, and speak words straight to the point;<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse is brief and direct. Speech should not be treated as harmless simply because it disappears after being spoken.<\/p><p>A message can be technically true and still be designed to humiliate, provoke, or mislead. Careful speech considers both truth and the way it is delivered.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Before sending a difficult message, remove one sentence that is only there to wound.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Before sending a difficult message, remove one sentence that is only there to wound.","questions":["Is it true?","Is it necessary?","Am I adding words that will only create damage?"]},{"n":58,"title":"Humility","part":"part-10","verse_ref":"QUR'AN • 31:18 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Turn not thy cheek in scorn toward folk, nor walk with pertness in the land. Lo! Allah loveth not each braggart boaster.","html":"<p class=\"lead\"><span class=\"dropcap\">H<\/span>umility begins when a person stops treating personal importance as a reason to look down on others.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 31:18 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Turn not thy cheek in scorn toward folk, nor walk with pertness in the land. Lo! Allah loveth not each braggart boaster.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse addresses scorn, manner of walking, and boasting. It reaches beyond private thought into visible behaviour.<\/p><p>A person can be educated, wealthy, successful, senior, or socially respected and still behave badly toward someone with less power. Humility is seen most clearly where status differences are present.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Notice one setting in which you unconsciously treat some people as more important than others. Change one behaviour there.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Notice one setting in which you unconsciously treat some people as more important than others. Change one behaviour there.","questions":["Who receives my patience?","Who receives my irritation?","Does status change how I speak?"]},{"n":59,"title":"Honesty","part":"part-10","verse_ref":"QUR'AN • 33:70 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Guard your duty to Allah, and speak words straight to the point;","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>ruthfulness becomes difficult when telling the truth costs something.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 33:70 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Guard your duty to Allah, and speak words straight to the point;<\/div><\/div><h2>What the verse gives us<\/h2><p>Speaking straight to the point requires more than avoiding an obvious lie. It asks for speech that is direct rather than deliberately misleading.<\/p><p>People often soften truth until it becomes deception, or exaggerate until the truth is buried. Honest speech can still be kind.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Correct one small misleading statement you have left uncorrected.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Correct one small misleading statement you have left uncorrected.","questions":["Where am I avoiding a necessary truth?","Can I say it without cruelty?","What would honest repair require?"]},{"n":60,"title":"Compassion","part":"part-10","verse_ref":"QUR'AN • 16:90 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Lo! Allah enjoineth justice and kindness, and giving to kinsfolk, and forbiddeth lewdness and abomination and wickedness. He exhorteth you in order that ye may take heed.","html":"<p class=\"lead\"><span class=\"dropcap\">C<\/span>oncern for other people becomes meaningful when it changes what we actually do.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 16:90 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Lo! Allah enjoineth justice and kindness, and giving to kinsfolk, and forbiddeth lewdness and abomination and wickedness. He exhorteth you in order that ye may take heed.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse places justice, kindness, and giving to relatives together. Compassion is therefore not only an emotion. It appears through conduct.<\/p><p>A person can feel sorry for someone and still do nothing. A smaller act done consistently may be more useful than a large expression of sympathy.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Identify one person whose need you know about. Offer a specific, practical form of help if it is appropriate.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Identify one person whose need you know about. Offer a specific, practical form of help if it is appropriate.","questions":["Who needs practical help rather than sympathy?","What can I actually do?","Can I help without humiliating the person?"]},{"n":61,"title":"Work and Earning","part":"part-11","verse_ref":"QUR'AN • 28:77 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"But seek the abode of the Hereafter in that which Allah hath given thee and neglect not thy portion of the world, and be thou kind even as Allah hath been kind to thee, and seek not corruption in the earth; lo! Allah loveth not corrupters,","html":"<p class=\"lead\"><span class=\"dropcap\">W<\/span>ork is part of ordinary human responsibility, but material pursuit should not become the only measure of life.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 28:77 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">But seek the abode of the Hereafter in that which Allah hath given thee and neglect not thy portion of the world, and be thou kind even as Allah hath been kind to thee, and seek not corruption in the earth; lo! Allah loveth not corrupters,<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse gives a balanced instruction in a passage concerning worldly wealth: seek the Hereafter, do not neglect the worldly portion, do good, and do not seek corruption.<\/p><p>Work can provide food, dignity, family support, and useful service. The problem begins when earning becomes an excuse for injustice, neglect, or corruption.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Look at your work in four ways: income, usefulness, honesty, and effect on other people.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Look at your work in four ways: income, usefulness, honesty, and effect on other people.","questions":["What does my work provide?","Where could profit tempt me toward unfairness?","Does my work leave room for my other responsibilities?"]},{"n":62,"title":"Wealth","part":"part-11","verse_ref":"QUR'AN • 64:15 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Your wealth and your children are only a temptation, whereas Allah! with Him is an immense reward.","html":"<p class=\"lead\"><span class=\"dropcap\">W<\/span>ealth can become a test because possession changes choices and priorities.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 64:15 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Your wealth and your children are only a temptation, whereas Allah! with Him is an immense reward.<\/div><\/div><h2>What the verse gives us<\/h2><p>The word “temptation” here should not be read as saying that wealth or children are inherently bad. The verse warns that what we value can test our priorities.<\/p><p>Money can buy comfort, but it can also create fear of loss, comparison, pride, or constant desire for more.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Write down what your money is currently doing: supporting needs, building security, serving others, or feeding unnecessary desire.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Write down what your money is currently doing: supporting needs, building security, serving others, or feeding unnecessary desire.","questions":["What does my wealth make easier?","What does it make harder?","Where is enough becoming never enough?"]},{"n":63,"title":"Giving","part":"part-11","verse_ref":"QUR'AN • 76:8-9 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And feed with food the needy wretch, the orphan and the prisoner, for love of Him, (Saying): We feed you, for the sake of Allah only. We wish for no reward nor thanks from you;","html":"<p class=\"lead\"><span class=\"dropcap\">G<\/span>iving is not only about having surplus. The Qur'an repeatedly connects generosity with responsibility toward others.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 76:8-9 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And feed with food the needy wretch, the orphan and the prisoner, for love of Him, (Saying): We feed you, for the sake of Allah only. We wish for no reward nor thanks from you;<\/div><\/div><h2>What the verse gives us<\/h2><p>The verses describe feeding people in need and explicitly remove the expectation of reward or thanks from the recipients. The original passage is specific; the broader principle of giving without seeking applause can be applied carefully.<\/p><p>Helping someone becomes less pure when the help is used to establish superiority or collect praise. Quiet assistance can preserve dignity.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Give one useful thing without turning it into a public performance.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Give one useful thing without turning it into a public performance.","questions":["Do I need the recipient to thank me?","Am I helping or displaying that I help?","Can the person's dignity remain intact?"]},{"n":64,"title":"Spending and Excess","part":"part-11","verse_ref":"QUR'AN • 17:27 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Lo! the squanderers were ever brothers of the devils, and the devil was ever an ingrate to his Lord.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an does not treat spending as morally neutral when it becomes wasteful or excessive.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 17:27 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Lo! the squanderers were ever brothers of the devils, and the devil was ever an ingrate to his Lord.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse is direct in its condemnation of squandering. It belongs to a wider passage that also discusses giving rights to relatives, needy people and travellers.<\/p><p>Excess can be obvious, such as buying far beyond need. It can also be hidden in repeated small purchases that create debt, clutter, or constant dissatisfaction.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Review the last ten non-essential purchases. Mark which were useful, impulsive, or forgotten.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Review the last ten non-essential purchases. Mark which were useful, impulsive, or forgotten.","questions":["What do I buy without thinking?","What does unnecessary spending cost me?","What would a more deliberate use of money look like?"]},{"n":65,"title":"Time","part":"part-11","verse_ref":"QUR'AN • 103:1-3 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"By the declining day, Lo! man is a state of loss, Save those who believe and do good works, and exhort one another to truth and exhort one another to endurance.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>ime is easy to waste because its loss is usually invisible until much later.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 103:1-3 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">By the declining day, Lo! man is a state of loss, Save those who believe and do good works, and exhort one another to truth and exhort one another to endurance.<\/div><\/div><h2>What the verse gives us<\/h2><p>Surah al-'Asr compresses the question of human loss into a short passage. It connects belief, good works, truth, and endurance rather than presenting success as private productivity alone.<\/p><p>A person can fill every hour and still waste a life. Busyness is not the same as useful action.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Track one ordinary day honestly. Notice where time goes without judging yourself first.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Track one ordinary day honestly. Notice where time goes without judging yourself first.","questions":["Where does my time actually go?","Which activity produces little value?","What deserves more time than it receives?"]},{"n":66,"title":"Justice","part":"part-11","verse_ref":"QUR'AN • 4:135 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Be ye staunch in justice, witnesses for Allah, even though it be against yourselves or (your) parents or your kindred, whether (the case be of) a rich man or a poor man, for Allah is nearer unto both (them ye are).","html":"<p class=\"lead\"><span class=\"dropcap\">J<\/span>ustice becomes real when it survives pressure, preference, family loyalty, and dislike.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 4:135 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Be ye staunch in justice, witnesses for Allah, even though it be against yourselves or (your) parents or your kindred, whether (the case be of) a rich man or a poor man, for Allah is nearer unto both (them ye are).<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse is unusually demanding because it includes the self and close relatives. It does not allow personal attachment to replace fairness.<\/p><p>In a workplace, family dispute, or financial matter, the temptation is to protect “our side.” Justice requires asking whether we would describe the same facts differently if the people were reversed.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Take one disagreement and write both sides as fairly as you can before defending your preferred side.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Take one disagreement and write both sides as fairly as you can before defending your preferred side.","questions":["Where does loyalty distort my judgment?","Would I accept the same standard against myself?","What fact am I avoiding?"]},{"n":67,"title":"Service","part":"part-11","verse_ref":"QUR'AN • 107:1-3 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Hast thou observed him who belieth religion? That is he who repelleth the orphan, and urgeth not the feeding of the needy.","html":"<p class=\"lead\"><span class=\"dropcap\">P<\/span>ersonal improvement is incomplete if it produces a person who thinks only about personal comfort.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 107:1-3 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Hast thou observed him who belieth religion? That is he who repelleth the orphan, and urgeth not the feeding of the needy.<\/div><\/div><h2>What the verse gives us<\/h2><p>The passage criticises a form of religious denial expressed through treatment of vulnerable people. It ties belief to conduct toward others.<\/p><p>Service does not always require a public project. It may be feeding someone, helping with a task, protecting dignity, teaching a useful skill, or noticing a person who is repeatedly ignored.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Choose one form of service that uses something you already have: time, food, knowledge, money, or practical help.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Choose one form of service that uses something you already have: time, food, knowledge, money, or practical help.","questions":["Who is easy for me to overlook?","What resource do I already have?","Can I use it without seeking status?"]},{"n":68,"title":"Gratitude","part":"part-12","verse_ref":"QUR'AN • 2:152 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Therefore remember Me, I will remember you. Give thanks to Me, and reject not Me.","html":"<p class=\"lead\"><span class=\"dropcap\">G<\/span>ratitude is not merely saying that life is good. It changes how a person recognises and uses what has been given.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 2:152 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Therefore remember Me, I will remember you. Give thanks to Me, and reject not Me.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse directly connects remembrance with giving thanks. Gratitude therefore belongs to a person's relationship with Allah, not only to positive thinking.<\/p><p>A grateful person can still be unhappy about a problem. Gratitude does not require denying pain. It requires noticing what remains a gift and responding to it properly.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Name three specific blessings and one responsibility attached to each.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Name three specific blessings and one responsibility attached to each.","questions":["What have I received?","How am I using it?","What responsibility comes with it?"]},{"n":69,"title":"Character","part":"part-12","verse_ref":"QUR'AN • 16:90 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Lo! Allah enjoineth justice and kindness, and giving to kinsfolk, and forbiddeth lewdness and abomination and wickedness. He exhorteth you in order that ye may take heed.","html":"<p class=\"lead\"><span class=\"dropcap\">C<\/span>haracter is what remains when a person is not being driven by a temporary burst of motivation.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 16:90 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Lo! Allah enjoineth justice and kindness, and giving to kinsfolk, and forbiddeth lewdness and abomination and wickedness. He exhorteth you in order that ye may take heed.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse gives conduct that can be repeated: justice, kindness, family responsibility, and avoidance of wrongdoing. Character is built through repeated conduct rather than a single emotional decision.<\/p><p>When motivation disappears, habits reveal priorities. The practical question is therefore not “How inspired am I?” but “What do I repeatedly do?”<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Choose one quality you want to make visible through repeated action this week.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Choose one quality you want to make visible through repeated action this week.","questions":["What quality do my habits currently show?","What do I do when nobody praises me?","What repeated action would change my character?"]},{"n":70,"title":"Becoming","part":"part-12","verse_ref":"QUR'AN • 13:11 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"For him are angels ranged before him and behind him, who guard him by Allah's command. Lo! Allah changeth not the condition of a folk until they (first) change that which is in their hearts; and if Allah willeth misfortune for a folk there is none that can repel it, nor have they a defender beside Him.","html":"<p class=\"lead\"><span class=\"dropcap\">A<\/span> person becomes different through repeated choices, not through reading alone.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 13:11 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">For him are angels ranged before him and behind him, who guard him by Allah's command. Lo! Allah changeth not the condition of a folk until they (first) change that which is in their hearts; and if Allah willeth misfortune for a folk there is none that can repel it, nor have they a defender beside Him.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse speaks about Allah's changing the condition of a people and what is in their hearts. It should not be turned into a simplistic claim that every external problem is caused by individual thoughts.<\/p><p>Change often begins with what a person is willing to examine: habits, intentions, priorities, resentments, dishonesty, or neglect. But external circumstances also exist, and the verse itself does not erase Allah's will and power.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Choose one inner change that can produce a visible change in conduct. Keep the change specific.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Choose one inner change that can produce a visible change in conduct. Keep the change specific.","questions":["What inner condition needs attention?","What behaviour would show that change?","What is outside my control?"]},{"n":71,"title":"Death","part":"part-12","verse_ref":"QUR'AN • 3:185 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"Every soul will taste of death. And ye will be paid on the Day of Resurrection only that which ye have fairly earned. Whoso is removed from the Fire and is made to enter paradise, he indeed is triumphant. The life of this world is but comfort of illusion.","html":"<p class=\"lead\"><span class=\"dropcap\">D<\/span>eath gives urgency to life because the Qur'an repeatedly presents this world as temporary.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 3:185 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">Every soul will taste of death. And ye will be paid on the Day of Resurrection only that which ye have fairly earned. Whoso is removed from the Fire and is made to enter paradise, he indeed is triumphant. The life of this world is but comfort of illusion.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse places death, recompense, and worldly life in one frame. It does not ask the reader to hate life. It changes the scale by which life is judged.<\/p><p>Mortality can expose priorities. A person may discover that some ambitions matter far less than family, justice, worship, service, and the way they treated people.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Write what you would want your present life to be known for if you knew it was limited.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Write what you would want your present life to be known for if you knew it was limited.","questions":["What am I postponing?","What matters more than my current distractions?","What conduct would I want to leave behind?"]},{"n":72,"title":"Accountability","part":"part-12","verse_ref":"QUR'AN • 99:7-8 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"And whoso doeth good an atom's weight will see it then, And whoso doeth ill an atom's weight will see it then.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an presents human action as something that will be answered for, not something that disappears because nobody saw it.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 99:7-8 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">And whoso doeth good an atom's weight will see it then, And whoso doeth ill an atom's weight will see it then.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verses are brief and direct. They do not give us permission to treat small acts as morally invisible.<\/p><p>Private messages, small dishonesties, quiet acts of kindness, and decisions made without witnesses still shape a person's moral life.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>At the end of the day, review one small act you are proud of and one small act you need to correct.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"At the end of the day, review one small act you are proud of and one small act you need to correct.","questions":["What small act did I overlook today?","Where did I choose convenience over honesty?","What can I repair tomorrow?"]},{"n":73,"title":"Success","part":"part-12","verse_ref":"QUR'AN • 3:200 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Endure, outdo all others in endurance, be ready, and observe your duty to Allah, in order that ye may succeed.","html":"<p class=\"lead\"><span class=\"dropcap\">S<\/span>uccess in the Qur'an is not defined only by money, status, comfort, or winning an argument.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 3:200 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Endure, outdo all others in endurance, be ready, and observe your duty to Allah, in order that ye may succeed.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse links success with endurance, readiness, and duty to Allah. It gives the word a moral and practical content rather than leaving it as a synonym for worldly achievement.<\/p><p>A person may achieve a goal and still damage relationships, integrity, or responsibility. Another person may face a setback while acting with endurance and duty.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Define one current goal twice: first by its result, then by the conduct required to pursue it properly.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Define one current goal twice: first by its result, then by the conduct required to pursue it properly.","questions":["What result am I chasing?","What kind of person am I becoming while chasing it?","What would success mean if the result is delayed?"]},{"n":74,"title":"The Life We Actually Lived","part":"part-12","verse_ref":"QUR'AN • 59:18 • MUHAMMAD MARMADUKE PICKTHALL","verse_text":"O ye who believe! Observe your duty to Allah. And let every soul look to that which it sendeth on before for the morrow. And observe your duty to Allah. Lo! Allah is Informed of what ye do.","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he final question is not what we intended to become, but what our repeated choices actually produced.<\/p><div class=\"verse-card\"><div class=\"verse-ref\">QUR'AN • 59:18 • MUHAMMAD MARMADUKE PICKTHALL<\/div><div class=\"verse-text\">O ye who believe! Observe your duty to Allah. And let every soul look to that which it sendeth on before for the morrow. And observe your duty to Allah. Lo! Allah is Informed of what ye do.<\/div><\/div><h2>What the verse gives us<\/h2><p>The verse asks each soul to look at what it has sent ahead. It directs attention toward what a person is actually putting forward, not only what the person plans to do someday.<\/p><p>At the end of a year, a decade, or a life, intentions cannot be the whole record. The record includes what we did, what we gave, what we refused, what we repaired, and how we treated people.<\/p><div class=\"callout\"><div class=\"clabel\">READ CAREFULLY<\/div><p>The example above is a practical application. It is not presented as the only meaning of the verse or as a replacement for its original context.<\/p><\/div><h2>What to do<\/h2><p>Do a quiet annual review. List what you sent forward through your conduct, not what you merely intended.<\/p>","practice_label":"ONE SMALL PRACTICE","practice":"Do a quiet annual review. List what you sent forward through your conduct, not what you merely intended.","questions":["What did I actually do?","What did I repeatedly postpone?","What do I want to send forward from this point?"]}],"matter":[{"id":"introduction","title":"Author's Note","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>he Qur'an does not need to be made mysterious in order to be deep.<\/p><p>This book starts with a practical question: <strong>What does the Qur'an tell a human being to understand, change, avoid, practice and become?<\/strong><\/p><p>We begin with the verse. We do not begin with a modern theory and then search for a verse that appears to support it.<\/p><p>Each chapter therefore follows a simple path: <strong>verse → understanding → practical situation → action → reflection.<\/strong><\/p><p>The language is deliberately plain. Where a Qur'anic Arabic term is useful, it is explained. Where the text does not establish a claim, the book does not manufacture one.<\/p><div class=\"pullquote\"><p>The purpose is not to make the Qur'an sound modern. The purpose is to make our reading of the Qur'an honest, understandable and usable.<\/p><\/div><h2>One important rule<\/h2><p>An application is an application. It is not automatically the literal meaning of the verse. The reader should always be able to see the difference.<\/p>"},{"id":"how-to-use-this-book","title":"How to Use This Book","html":"<div class=\"grid2\"><div class=\"card\"><strong>READ<\/strong><br>Read the verse slowly. Notice what it actually says.<\/div><div class=\"card\"><strong>UNDERSTAND<\/strong><br>Read the short explanation without adding claims that are not established.<\/div><div class=\"card\"><strong>APPLY<\/strong><br>Put the principle beside a real situation from your own life.<\/div><div class=\"card\"><strong>PRACTICE<\/strong><br>Take one small action rather than making a large promise.<\/div><\/div><h2>The editorial distinction<\/h2><div class=\"tw\"><table class=\"data\"><tr><th>Layer<\/th><th>Meaning<\/th><\/tr><tr><td>Qur'anic text<\/td><td>The verse itself, with exact reference and identified translation.<\/td><\/tr><tr><td>Explanation<\/td><td>A restrained explanation that stays close to the wording and context.<\/td><\/tr><tr><td>Application<\/td><td>A practical example of how the guidance can be lived today.<\/td><\/tr><\/table>"},{"id":"before-you-begin","title":"Before You Begin","html":"<p class=\"lead\"><span class=\"dropcap\">T<\/span>his is not a book of slogans. It is a working reading of selected Qur'anic instructions and descriptions.<\/p><div class=\"grid2\"><div class=\"card\"><strong>Stay with the verse.<\/strong><br>Do not rush past the wording to reach the lesson.<\/div><div class=\"card\"><strong>Separate fact from application.<\/strong><br>A modern example is there to make an instruction easier to see, not to change its meaning.<\/div><div class=\"card\"><strong>Allow uncertainty.<\/strong><br>If a point cannot be established from the text, it should not be stated as certainty.<\/div><div class=\"card\"><strong>Try one thing.<\/strong><br>The reader should leave each chapter with something practical to test.<\/div><\/div><div class=\"pullquote\"><p>Simple does not mean shallow. A clear sentence can carry a serious idea.<\/p><\/div>"},{"id":"note-on-the-text","title":"A Note on the Text","html":"<p class=\"lead\">The Qur'an is quoted in this book in the English translation of Muhammad Marmaduke Pickthall.<\/p><p>Pickthall’s <em>The Meaning of the Glorious Koran<\/em> appeared in 1930 and is now in the public domain. Verse references follow the standard surah and ayah numbering: “Qur’an · 53:39” means surah 53, ayah 39. Where a verse is quoted, the wording is Pickthall’s.<\/p><p>Everything around the quotation — the explanation, the application and the practice — is the author’s own reading. This is a practical reading, not a commentary (<em>tafsir<\/em>) and not a ruling. An application shows how a principle might be lived; it is not offered as the verse’s only meaning.<\/p><div class=\"tw\"><table class=\"data\"><tr><th>Source<\/th><th>Use in this book<\/th><\/tr><tr><td>The Qur’an (Arabic text)<\/td><td>The scripture. Verses are referred to by surah and ayah.<\/td><\/tr><tr><td>M. Marmaduke Pickthall, <em>The Meaning of the Glorious Koran<\/em> (1930)<\/td><td>The English translation quoted throughout. Public domain.<\/td><\/tr><tr><td>The Quranic Arabic Corpus<\/td><td>Used to check verse references against a standard numbering.<\/td><\/tr><\/table>"},{"id":"closing","title":"A Seven-Day Practice","html":"<p class=\"lead\"><span class=\"dropcap\">D<\/span>o not read this book only as information. Choose one instruction and live it deliberately.<\/p><ol><li><strong>Day 1 — Read:<\/strong> choose one chapter and reread its verse.<\/li><li><strong>Day 2 — Notice:<\/strong> identify where your present behaviour differs from the instruction.<\/li><li><strong>Day 3 — Pause:<\/strong> notice the moment when the old behaviour usually begins.<\/li><li><strong>Day 4 — Act:<\/strong> make one small change.<\/li><li><strong>Day 5 — Repeat:<\/strong> practise the same change again.<\/li><li><strong>Day 6 — Review:<\/strong> record what worked and what failed.<\/li><li><strong>Day 7 — Continue:<\/strong> decide whether the practice should become part of your routine.<\/li><\/ol><h2>Final question<\/h2><p>After reading, what will you actually do differently?<\/p><div class=\"takeaway\"><div class=\"tlabel\">READ. LIVE. TRANSFORM.<\/div><p>The book ends at the page. The test of the book begins in life.<\/p><\/div><figure class=\"fig\"><svg class=\"fig-svg\" viewBox=\"0 0 640 582\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\"><text x=\"320.0\" y=\"18.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"17\" font-weight=\"600\" font-style=\"normal\" fill=\"#315c52\" text-anchor=\"middle\" dominant-baseline=\"middle\">A seven-day practice<\/text><rect x=\"122.0\" y=\"34.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f3ede1\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"61.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 1 — Read<\/text><line x1=\"320.0\" y1=\"88.0\" x2=\"320.0\" y2=\"106.0\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><polygon points=\"320.0,114.0 316.2,107.0 323.8,107.0\" fill=\"#dadfd8\"/><rect x=\"122.0\" y=\"114.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f6f1e7\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"141.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 2 — Notice<\/text><line x1=\"320.0\" y1=\"168.0\" x2=\"320.0\" y2=\"186.0\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><polygon points=\"320.0,194.0 316.2,187.0 323.8,187.0\" fill=\"#dadfd8\"/><rect x=\"122.0\" y=\"194.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f3ede1\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"221.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 3 — Pause<\/text><line x1=\"320.0\" y1=\"248.0\" x2=\"320.0\" y2=\"266.0\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><polygon points=\"320.0,274.0 316.2,267.0 323.8,267.0\" fill=\"#dadfd8\"/><rect x=\"122.0\" y=\"274.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f6f1e7\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"301.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 4 — Act<\/text><line x1=\"320.0\" y1=\"328.0\" x2=\"320.0\" y2=\"346.0\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><polygon points=\"320.0,354.0 316.2,347.0 323.8,347.0\" fill=\"#dadfd8\"/><rect x=\"122.0\" y=\"354.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f3ede1\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"381.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 5 — Repeat<\/text><line x1=\"320.0\" y1=\"408.0\" x2=\"320.0\" y2=\"426.0\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><polygon points=\"320.0,434.0 316.2,427.0 323.8,427.0\" fill=\"#dadfd8\"/><rect x=\"122.0\" y=\"434.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f6f1e7\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"461.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 6 — Review<\/text><line x1=\"320.0\" y1=\"488.0\" x2=\"320.0\" y2=\"506.0\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><polygon points=\"320.0,514.0 316.2,507.0 323.8,507.0\" fill=\"#dadfd8\"/><rect x=\"122.0\" y=\"514.0\" width=\"396.0\" height=\"54.0\" rx=\"9\" ry=\"9\" fill=\"#f3ede1\" stroke=\"#dadfd8\" stroke-width=\"1.60\"/><text x=\"320.0\" y=\"541.0\" font-family=\"'EB Garamond', Georgia, 'Noto Sans Devanagari', serif\" font-size=\"16\" font-weight=\"400\" font-style=\"normal\" fill=\"#20272e\" text-anchor=\"middle\" dominant-baseline=\"middle\">Day 7 — Continue<\/text><\/svg><figcaption>A seven-day practice<\/figcaption><\/figure>"}],"glossary":[["Allah","The Arabic word for God. In the Qur'an it is the proper name of the One God."],["Ayah (plural ayat)","A verse of the Qur'an; literally a ‘sign’."],["Qur'an","The scripture of Islam, understood by Muslims as the word of God revealed to the Prophet Muhammad."],["Surah","A chapter of the Qur'an. The Qur'an has 114 surahs."],["Surah al-'Asr","The 103rd surah of the Qur'an, on loss, belief and good conduct."],["Tawakkul","Reliance on, or trust in, God. In this book it is placed after responsible decision and effort, never instead of them."],["Pickthall, Muhammad Marmaduke","British writer and translator (1875–1936). His 1930 English translation, The Meaning of the Glorious Koran, is the translation quoted in this book and is in the public domain."]],"about_html":"<p>Dr Sohil Momin has practised classical homoeopathy for more than seventeen years, with constitutional prescribing in a high-volume OPD and a focus on dermatology. He is President of the Charity for Humanity Trust and directs community welfare programmes in Vadodara, including a weekly meal distribution. He is also a published poet, a spiritual thinker and a social worker.<\/p><p>He is the founder of Aurum Homoeopathic Clinic and serves as Medical Officer at Shree Mahalaxmiji Mahila Homoeopathic Medical College &amp; Hospital, Vadodara. He supervises ninety to a hundred interns a year, works on hospital administration and clinical research, and self-publishes under the MATNEO imprint.<\/p><\/div><\/div>"}</script>

<script>const BOOK = JSON.parse(document.getElementById('bookdata').textContent);
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const RANKS=[['E',1,3,'Seeker'],['D',4,6,'Student'],['C',7,9,'Practitioner'],
             ['B',10,12,'Steady'],['A',13,15,'Devoted'],['S',16,99,'Transformed']];
const xpForLevel = l => 80 + (l-1)*40;
function levelInfo(xp){ let l=1, rem=xp||0; while(rem>=xpForLevel(l)){ rem-=xpForLevel(l); l++; }
  return {level:l, into:rem, need:xpForLevel(l)}; }
const rankFor = l => RANKS.find(r=>l>=r[1]&&l<=r[2]) || RANKS[RANKS.length-1];
const XP = {read:10, keep:15, done:5, seven:10, sevenBonus:60, quest:25};
const ACH = [
  {id:'r1',  t:'First Verse',  d:'Read your first chapter',      ok:s=>Object.keys(s.read).length>=1},
  {id:'r10', t:'Ten Chapters', d:'Read ten chapters',            ok:s=>Object.keys(s.read).length>=10},
  {id:'r37', t:'Halfway',      d:'Read thirty-seven chapters',   ok:s=>Object.keys(s.read).length>=37},
  {id:'r74', t:'Whole Book',   d:'Read all seventy-four',        ok:s=>Object.keys(s.read).length>=74},
  {id:'m1',  t:'First Move',   d:'Keep a practice',              ok:s=>s.moves.length>=1},
  {id:'m10', t:'Ten Moves',    d:'Keep ten practices',           ok:s=>s.moves.length>=10},
  {id:'s7',  t:'Seven Days',   d:'Finish the seven-day practice',ok:s=>Object.values(s.seven.done).filter(Boolean).length>=7},
  {id:'k7',  t:'Week Streak',  d:'Open the app 7 days in a row', ok:s=>s.streak>=7},
  {id:'k30', t:'Month Streak', d:'Open the app 30 days in a row',ok:s=>s.streak>=30},
  {id:'d50', t:'Consistent',   d:'Keep a practice on 50 days',   ok:s=>s.moves.reduce((a,m)=>a+Object.values(m.done).filter(Boolean).length,0)>=50},
];
const LEGACY_KEY='rlt.v2';
const store = {
  k:'rlt.v2', s:null,
  // Persistence now comes from web-kit's Loom.storage (namespaced, JSON-safe)
  // instead of hand-rolled localStorage. A store saved before this change (the
  // legacy key) is migrated into Loom.storage once, on first load - no data loss.
  load(){
    try{
      const legacy=localStorage.getItem(LEGACY_KEY);
      if(legacy!=null && Loom.storage.get('rlt', null)==null){ Loom.storage.set('rlt', JSON.parse(legacy)); localStorage.removeItem(LEGACY_KEY); }
    }catch(e){}
    this.s = Loom.storage.get('rlt', {}) || {};
    const s=this.s;
    s.read=s.read||{}; s.moves=s.moves||[]; s.notes=s.notes||{};
    s.seven=s.seven||{start:null,done:{}}; s.days=s.days||[]; s.streak=s.streak||0; s.lastOpen=s.lastOpen||null;
    s.xp=s.xp||0; s.level=s.level||1; s.earned=s.earned||{}; s.ach=s.ach||[];
    return s; },
  save(){ Loom.storage.set('rlt', this.s); }
};
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const todayISO = () => iso(new Date());
const dayOfYear = () => { const n=new Date(), s=new Date(n.getFullYear(),0,0); return Math.floor((n-s)/864e5); };
const todaysChapter = () => BOOK.chapters[ dayOfYear() % BOOK.chapters.length ];
const chapterByN = n => BOOK.chapters.find(c=>c.n===n);
const partOf = n => BOOK.parts.find(p=>p.chapters.includes(n));
function touchStreak(){ const s=store.s, t=todayISO(); if(s.lastOpen===t) return;
  const y=iso(new Date(Date.now()-864e5)); s.streak=(s.lastOpen===y)?s.streak+1:1; s.lastOpen=t;
